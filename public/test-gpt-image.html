<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GPT 图片生成测试 - 虚拟男友</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      background: white;
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    h1 {
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      font-size: 36px;
      margin-bottom: 10px;
    }
    .subtitle {
      color: #666;
      margin-bottom: 30px;
    }
    .nav-links {
      margin-bottom: 30px;
      padding-bottom: 20px;
      border-bottom: 2px solid #f0f0f0;
    }
    .nav-links a {
      color: #f5576c;
      text-decoration: none;
      margin-right: 20px;
      font-weight: 600;
    }
    .input-section {
      background: #f8f9fa;
      padding: 25px;
      border-radius: 12px;
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-weight: 600;
      margin-bottom: 10px;
      color: #333;
    }
    input, textarea, select {
      width: 100%;
      padding: 15px;
      border: 2px solid #e9ecef;
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
      margin-bottom: 15px;
      transition: border-color 0.2s;
    }
    input:focus, textarea:focus, select:focus {
      outline: none;
      border-color: #f5576c;
    }
    textarea {
      min-height: 120px;
      resize: vertical;
    }
    .button-group {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
    }
    button {
      padding: 15px 30px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-primary {
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
      color: white;
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 15px rgba(245, 87, 108, 0.4);
    }
    .btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
    .btn-secondary {
      background: #e9ecef;
      color: #495057;
    }
    .btn-secondary:hover {
      background: #dee2e6;
    }
    .result-section {
      display: none;
    }
    .result-section.active {
      display: block;
    }
    .result-box {
      background: #f8f9fa;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 20px;
      border-left: 4px solid #f5576c;
    }
    .result-box.success {
      border-left-color: #28a745;
    }
    .result-box.error {
      border-left-color: #dc3545;
    }
    .result-label {
      font-weight: 600;
      color: #495057;
      margin-bottom: 10px;
    }
    .result-content {
      font-family: 'Courier New', monospace;
      font-size: 13px;
      white-space: pre-wrap;
      word-break: break-all;
      color: #333;
    }
    .image-preview {
      margin-top: 20px;
      text-align: center;
    }
    .image-preview img {
      max-width: 100%;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    }
    .image-actions {
      margin-top: 15px;
      display: flex;
      gap: 10px;
      justify-content: center;
    }
    .loading {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid rgba(255,255,255,.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 1s ease-in-out infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .examples {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 15px;
    }
    .example-tag {
      background: #e9ecef;
      color: #495057;
      padding: 8px 15px;
      border-radius: 20px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .example-tag:hover {
      background: #f5576c;
      color: white;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎨 GPT 图片生成测试</h1>
    <p class="subtitle">测试 GPT-Image-1.5 API 图片生成功能</p>

    <div class="nav-links">
      <a href="/">← 返回首页</a>
      <a href="/test-api.html">API 测试中心</a>
      <a href="/api-status.html">系统状态</a>
    </div>

    <div class="input-section">
      <label>示例提示词（点击快速填入）：</label>
      <div class="examples">
        <span class="example-tag" onclick="setPrompt('一只优雅的波斯猫坐在丝绒垫子上，金色夕阳透过窗户洒在它身上，超写实风格')">🐱 猫咪</span>
        <span class="example-tag" onclick="setPrompt('梦幻般的樱花盛开在富士山下，粉色花瓣飘落，油画风格')">🗻 富士山樱花</span>
        <span class="example-tag" onclick="setPrompt('未来感都市夜景，霓虹灯闪烁，赛博朋克风格，8K超高清')">🌃 赛博朋克</span>
        <span class="example-tag" onclick="setPrompt('森林小屋，烟囱冒着炊烟，周围有野花和小溪，温馨治愈系')">🏕️ 森林小屋</span>
      </div>

      <label for="prompt">图片描述（Prompt）：</label>
      <textarea id="prompt" placeholder="请输入你想生成的图片描述...">一只优雅的波斯猫坐在丝绒垫子上，金色夕阳透过窗户洒在它身上，超写实风格</textarea>

      <div class="button-group">
        <button class="btn-primary" id="generate-btn" onclick="generateImage()">
          <span id="btn-text">🎨 生成图片</span>
        </button>
        <button class="btn-secondary" onclick="clearAll()">清空</button>
      </div>
    </div>

    <div class="result-section" id="result-section">
      <div class="result-box" id="result-box">
        <div class="result-label">生成结果：</div>
        <div class="result-content" id="result-content"></div>
      </div>

      <div class="image-preview" id="image-preview" style="display: none;">
        <img id="generated-image" alt="Generated Image">
        <div class="image-actions">
          <button class="btn-secondary" onclick="downloadImage()">⬇️ 下载图片</button>
          <button class="btn-secondary" onclick="openNewTab()">🔍 新标签页打开</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = '';
    let currentImageUrl = '';

    // 设置提示词
    function setPrompt(text) {
      document.getElementById('prompt').value = text;
    }

    // 生成图片
    async function generateImage() {
      const prompt = document.getElementById('prompt').value.trim();
      if (!prompt) {
        showResult('error', '请输入图片描述');
        return;
      }

      const btn = document.getElementById('generate-btn');
      const btnText = document.getElementById('btn-text');

      // 显示加载状态
      btn.disabled = true;
      btnText.innerHTML = '<span class="loading"></span> 生成中...';

      try {
        const response = await fetch(`${API_BASE}/api/image`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ prompt })
        });

        const data = await response.json();

        if (data.success && data.imageUrl) {
          showResult('success', `✅ 图片生成成功！\n提示词: ${prompt}\n图片URL: ${data.imageUrl}`);
          displayImage(data.imageUrl);
        } else {
          showResult('error', `❌ 生成失败\n响应: ${JSON.stringify(data, null, 2)}`);
        }
      } catch (error) {
        showResult('error', `❌ 请求失败\n错误: ${error.message}`);
      } finally {
        // 恢复按钮状态
        btn.disabled = false;
        btnText.innerHTML = '🎨 生成图片';
      }
    }

    // 显示结果
    function showResult(type, message) {
      const section = document.getElementById('result-section');
      const box = document.getElementById('result-box');
      const content = document.getElementById('result-content');

      section.classList.add('active');
      box.className = `result-box ${type}`;
      content.textContent = message;
    }

    // 显示图片
    function displayImage(url) {
      currentImageUrl = url;
      const img = document.getElementById('generated-image');
      const preview = document.getElementById('image-preview');

      img.src = url;
      preview.style.display = 'block';

      // 图片加载错误处理
      img.onerror = function() {
        showResult('error', `❌ 图片加载失败\nURL: ${url}`);
      };
    }

    // 下载图片
    function downloadImage() {
      if (!currentImageUrl) return;
      window.open(currentImageUrl, '_blank');
    }

    // 新标签页打开
    function openNewTab() {
      if (!currentImageUrl) return;
      window.open(currentImageUrl, '_blank');
    }

    // 清空所有
    function clearAll() {
      document.getElementById('prompt').value = '';
      document.getElementById('result-section').classList.remove('active');
      document.getElementById('image-preview').style.display = 'none';
      currentImageUrl = '';
    }
  </script>
</body>
</html>
