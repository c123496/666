<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>API 测试页面 - 虚拟男友</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      background: white;
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    h1 {
      color: #333;
      margin-bottom: 10px;
      font-size: 32px;
    }
    .subtitle {
      color: #666;
      margin-bottom: 30px;
      font-size: 14px;
    }
    .test-section {
      background: #f8f9fa;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
    }
    .test-section h2 {
      color: #444;
      font-size: 18px;
      margin-bottom: 15px;
    }
    .button-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    button {
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }
    .btn-secondary {
      background: #e9ecef;
      color: #495057;
    }
    .btn-secondary:hover {
      background: #dee2e6;
    }
    .result {
      margin-top: 15px;
      padding: 15px;
      border-radius: 8px;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      white-space: pre-wrap;
      word-break: break-all;
      display: none;
    }
    .result.success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
      display: block;
    }
    .result.error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
      display: block;
    }
    .result.info {
      background: #d1ecf1;
      color: #0c5460;
      border: 1px solid #bee5eb;
      display: block;
    }
    .status-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      margin-left: 10px;
    }
    .status-online {
      background: #d4edda;
      color: #155724;
    }
    .status-offline {
      background: #f8d7da;
      color: #721c24;
    }
    input, textarea {
      width: 100%;
      padding: 12px;
      border: 2px solid #e9ecef;
      border-radius: 8px;
      font-size: 14px;
      margin-bottom: 10px;
      font-family: inherit;
    }
    input:focus, textarea:focus {
      outline: none;
      border-color: #667eea;
    }
    textarea {
      min-height: 100px;
      resize: vertical;
    }
    .nav-links {
      margin-bottom: 20px;
      padding-bottom: 20px;
      border-bottom: 2px solid #e9ecef;
    }
    .nav-links a {
      color: #667eea;
      text-decoration: none;
      margin-right: 20px;
      font-weight: 600;
    }
    .nav-links a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🧪 API 测试中心</h1>
    <p class="subtitle">虚拟男友项目 - API 功能测试</p>

    <div class="nav-links">
      <a href="/">← 返回首页</a>
      <a href="/api-status.html">系统状态</a>
    </div>

    <!-- 系统状态检查 -->
    <div class="test-section">
      <h2>
        📊 系统状态
        <span id="status-badge" class="status-badge status-offline">检测中...</span>
      </h2>
      <div class="button-group">
        <button class="btn-primary" onclick="testStatus()">检查系统状态</button>
        <button class="btn-secondary" onclick="clearResult('status-result')">清空</button>
      </div>
      <div id="status-result" class="result"></div>
    </div>

    <!-- 聊天 API 测试 -->
    <div class="test-section">
      <h2>💬 聊天 API 测试</h2>
      <textarea id="chat-message" placeholder="输入消息内容...">你好，今天心情怎么样？</textarea>
      <div class="button-group">
        <button class="btn-primary" onclick="testChat()">发送消息</button>
        <button class="btn-secondary" onclick="clearResult('chat-result')">清空</button>
      </div>
      <div id="chat-result" class="result"></div>
    </div>

    <!-- 图片生成 API 测试 -->
    <div class="test-section">
      <h2>🖼️ 图片生成 API 测试</h2>
      <input type="text" id="image-prompt" placeholder="输入图片描述..." value="一只可爱的猫咪在花园里玩耍">
      <div class="button-group">
        <button class="btn-primary" onclick="testImage()">生成图片</button>
        <button class="btn-secondary" onclick="clearResult('image-result')">清空</button>
      </div>
      <div id="image-result" class="result"></div>
      <div id="image-preview" style="margin-top: 15px; display: none;">
        <img id="generated-image" style="max-width: 100%; border-radius: 8px;">
      </div>
    </div>

    <!-- 语音识别 API 测试 -->
    <div class="test-section">
      <h2>🎤 语音识别 API 测试</h2>
      <p style="color: #666; margin-bottom: 10px; font-size: 14px;">此功能需要音频文件，暂时跳过</p>
      <div class="button-group">
        <button class="btn-secondary" disabled>功能开发中</button>
      </div>
    </div>

    <!-- 视频搜索 API 测试 -->
    <div class="test-section">
      <h2>🎬 视频搜索 API 测试</h2>
      <input type="text" id="video-query" placeholder="输入搜索关键词..." value="可爱宠物">
      <div class="button-group">
        <button class="btn-primary" onclick="testVideoSearch()">搜索视频</button>
        <button class="btn-secondary" onclick="clearResult('video-result')">清空</button>
      </div>
      <div id="video-result" class="result"></div>
    </div>

  </div>

  <script>
    const API_BASE = '';

    // 显示结果
    function showResult(elementId, data, isSuccess = true) {
      const element = document.getElementById(elementId);
      element.className = `result ${isSuccess ? 'success' : 'error'}`;
      element.textContent = typeof data === 'string' ? data : JSON.stringify(data, null, 2);
    }

    // 清空结果
    function clearResult(elementId) {
      const element = document.getElementById(elementId);
      element.className = 'result';
      element.textContent = '';
      if (elementId === 'image-result') {
        document.getElementById('image-preview').style.display = 'none';
      }
    }

    // 测试系统状态
    async function testStatus() {
      try {
        const response = await fetch(`${API_BASE}/api/status`);
        const data = await response.json();

        document.getElementById('status-badge').className = 'status-badge status-online';
        document.getElementById('status-badge').textContent = '在线';

        showResult('status-result', {
          status: '✅ 系统正常',
          response: data
        }, true);
      } catch (error) {
        document.getElementById('status-badge').className = 'status-badge status-offline';
        document.getElementById('status-badge').textContent = '离线';

        showResult('status-result', {
          status: '❌ 系统异常',
          error: error.message
        }, false);
      }
    }

    // 测试聊天 API
    async function testChat() {
      const message = document.getElementById('chat-message').value;
      if (!message.trim()) {
        showResult('chat-result', '请输入消息内容', false);
        return;
      }

      try {
        const response = await fetch(`${API_BASE}/api/chat`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ message })
        });

        const data = await response.json();
        showResult('chat-result', {
          status: '✅ 聊天成功',
          request: { message },
          response: data
        }, true);
      } catch (error) {
        showResult('chat-result', {
          status: '❌ 聊天失败',
          error: error.message
        }, false);
      }
    }

    // 测试图片生成 API
    async function testImage() {
      const prompt = document.getElementById('image-prompt').value;
      if (!prompt.trim()) {
        showResult('image-result', '请输入图片描述', false);
        return;
      }

      try {
        const response = await fetch(`${API_BASE}/api/image`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ prompt })
        });

        const data = await response.json();

        if (data.imageUrl) {
          showResult('image-result', {
            status: '✅ 图片生成成功',
            prompt: prompt,
            imageUrl: data.imageUrl
          }, true);

          document.getElementById('generated-image').src = data.imageUrl;
          document.getElementById('image-preview').style.display = 'block';
        } else {
          showResult('image-result', {
            status: '⚠️ 生成完成',
            response: data
          }, true);
        }
      } catch (error) {
        showResult('image-result', {
          status: '❌ 图片生成失败',
          error: error.message
        }, false);
      }
    }

    // 测试视频搜索 API
    async function testVideoSearch() {
      const query = document.getElementById('video-query').value;
      if (!query.trim()) {
        showResult('video-result', '请输入搜索关键词', false);
        return;
      }

      try {
        const response = await fetch(`${API_BASE}/api/video-search`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ query })
        });

        const data = await response.json();
        showResult('video-result', {
          status: '✅ 搜索成功',
          query: query,
          results: data
        }, true);
      } catch (error) {
        showResult('video-result', {
          status: '❌ 搜索失败',
          error: error.message
        }, false);
      }
    }

    // 页面加载时自动检测状态
    window.onload = function() {
      testStatus();
    };
  </script>
</body>
</html>
